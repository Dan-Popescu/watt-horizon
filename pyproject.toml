[project]
name = "radar"
version = "0.1.0"
description = "Early detection of grid-connection projects (battery storage, data centers) from French public documents."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "truststore>=0.10.4,<1",
    "pydantic>=2.14,<3",
    "pymupdf>=1.28,<2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
llm = ["anthropic>=1.13,<2"]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4", "PIE", "RET", "TID"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # French text uses typographic quotes and accents
    "E501",  # `ruff format` owns line length; long regex literals stay unbroken for readability
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["radar"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "truststore"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = ["network: hits real websites or APIs (opt-in: pytest -m network)"]
anyio_mode = "auto"
