# docker compose up -d                          web + MCP on http://localhost:8765 (token required)
# docker compose run --rm update                daily job (schedule it with cron / a systemd timer)
# Secrets come from a local .env file (never committed): RADAR_API_TOKEN, optionally ANTHROPIC_API_KEY, RADAR_LLM_MODEL.
x-reading-environment: &reading-environment
  RADAR_PDF_WORKERS: ${RADAR_PDF_WORKERS:-2}
  RADAR_PDF_MAX_BYTES: ${RADAR_PDF_MAX_BYTES:-26214400}
  RADAR_PDF_MAX_PAGES: ${RADAR_PDF_MAX_PAGES:-300}
  RADAR_PDF_BATCH_BYTES: ${RADAR_PDF_BATCH_BYTES:-67108864}
  RADAR_PDF_TIMEOUT_S: ${RADAR_PDF_TIMEOUT_S:-30}
  RADAR_OCR_MAX_PAGES: ${RADAR_OCR_MAX_PAGES:-50}
  RADAR_OCR_MAX_PIXELS: ${RADAR_OCR_MAX_PIXELS:-20000000}
  RADAR_OCR_TIMEOUT_S: ${RADAR_OCR_TIMEOUT_S:-60}
  RADAR_PDF_TABLES: ${RADAR_PDF_TABLES:-0}
  RADAR_PDF_TABLE_MAX_PAGES: ${RADAR_PDF_TABLE_MAX_PAGES:-20}
  RADAR_PDF_TABLE_MAX_ROWS: ${RADAR_PDF_TABLE_MAX_ROWS:-2000}
  RADAR_PDF_TABLE_MAX_CHARS: ${RADAR_PDF_TABLE_MAX_CHARS:-200000}
  RADAR_OCR_SECONDARY: ${RADAR_OCR_SECONDARY:-0}
  RADAR_OCR_SECONDARY_MAX_PAGES: ${RADAR_OCR_SECONDARY_MAX_PAGES:-8}

services:
  web:
    build: .
    image: watt-horizon
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["radar-data:/data"]
    environment:
      <<: *reading-environment
      RADAR_API_TOKEN: ${RADAR_API_TOKEN:?set RADAR_API_TOKEN in .env}
      RADAR_OFFLINE: "1"
      RADAR_GOLD_DIR: /data/gold
      RADAR_PUBLISHED_DIR: ${RADAR_PUBLISHED_DIR:-}
    command: ["radar", "web", "--host", "0.0.0.0", "--port", "8765", "--public-host", "${RADAR_PUBLIC_HOST:-localhost}"]
    restart: unless-stopped
    init: true
    cpus: ${RADAR_WEB_CPUS:-1.0}
    mem_limit: ${RADAR_WEB_MEMORY:-512m}
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]

  update:
    image: watt-horizon
    profiles: ["jobs"]
    volumes: ["radar-data:/data", "radar-backups:/backups"]
    environment:
      <<: *reading-environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-}
      RADAR_LLM_FAST_MODEL: ${RADAR_LLM_FAST_MODEL:-}
      RADAR_LLM_PASSAGES: ${RADAR_LLM_PASSAGES:-0}
      RADAR_LLM_CHECK: ${RADAR_LLM_CHECK:-1}
      RADAR_GOLD_DIR: /data/gold
      RADAR_LLM_DAILY_BUDGET_USD: ${RADAR_LLM_DAILY_BUDGET_USD:-0}
      RADAR_LLM_CAMPAIGN_BUDGET_USD: ${RADAR_LLM_CAMPAIGN_BUDGET_USD:-0}
      RADAR_LLM_FILING_BUDGET_USD: ${RADAR_LLM_FILING_BUDGET_USD:-0}
      RADAR_LLM_PRICING_PATH: ${RADAR_LLM_PRICING_PATH:-/data/llm-pricing.json}
      RADAR_LLM_MAX_ATTEMPTS: ${RADAR_LLM_MAX_ATTEMPTS:-3}
      RADAR_LLM_CAMPAIGN: ${RADAR_LLM_CAMPAIGN:-default}
      RADAR_LLM_WAIT_TIMEOUT_S: ${RADAR_LLM_WAIT_TIMEOUT_S:-3600}
      RADAR_EVALUATION_CAMPAIGN: ${RADAR_EVALUATION_CAMPAIGN:-default}
      RADAR_EVAL_TEST_AFTER: ${RADAR_EVAL_TEST_AFTER:-}
      RADAR_HTTP_MAX_BYTES: ${RADAR_HTTP_MAX_BYTES:-33554432}
      RADAR_HTTP_DEADLINE_S: ${RADAR_HTTP_DEADLINE_S:-60}
    command: ["radar", "update"]
    init: true
    cpus: ${RADAR_JOB_CPUS:-2.0}
    mem_limit: ${RADAR_JOB_MEMORY:-2g}
    pids_limit: 256

volumes:
  radar-data:
  radar-backups:
